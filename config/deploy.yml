service: task_list
image: playarea1/task-list

servers:
  web:
    - 13.184.244.165

proxy:
  ssl: true
  host: 13.184.244.165.sslip.io

registry:
  server: ghcr.io
  username: playarea1
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    DB_HOST: task_list-db
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD

ssh:
  user: ubuntu

asset_path: /rails/public/vite

builder:
  arch: amd64

accessories:
  db:
    image: postgres:17
    host: 13.184.244.165
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: task_list
        POSTGRES_DB: task_list_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
